version: '3.8'

services:
  airflow:
    image: apache/airflow:2.9.3
    container_name: abd_dataops-airflow
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=9Qtu2ONg0DKcV4O6-eI5c2L7K8m6nS8W5_aZ8z9KXwU=
      - PYTHONPATH=/opt/airflow:/opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/logs:/opt/airflow/logs
      - ./ml:/opt/airflow/ml
      - .:/opt/airflow/project
    command: bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin && airflow scheduler & airflow webserver"
    ports:
      - "8080:8080"
    working_dir: /opt/airflow/project
